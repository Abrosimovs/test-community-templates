          description: 'TLS certificate verification for script items: "none" - disabled, "peer" - verify the certificate chain and expiration, "full" - full verification. Any other value enables full verification. To override the setting for this template only, define the macro with the context "OpenRouter", e.g. {$HTTP.TLS.VERIFY:"OpenRouter"}.'
