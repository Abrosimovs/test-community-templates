              name: 'Workspace [{#WORKSPACE.NAME}]: API key [{#API_KEY.NAME}]: Expire in'
              type: DEPENDENT
              key: 'openrouter.api_key.expire[{#WORKSPACE.ID},{#API_KEY.HASH}]'
              units: uptime
              description: 'Time left until `{#API_KEY.NAME}` API key expiration.'
              preprocessing:
                - type: CHECK_JSON_ERROR
                  parameters:
                    - $.error
                - type: JSONPATH
                  parameters:
                    - $.overview.expires_at
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var safe_iso_string = value.replace(/(\.\d{3})\d+/, '$1'),
                      	unixtime = new Date(safe_iso_string).getTime();
                      
                      if (isNaN(unixtime)) {
                      	Zabbix.log(4, '[ OpenRouter API ] ERROR: Failed to parse value "' + value + '". Wrong date format. Expected ISO 8601 format: "YYYY-MM-DDTHH:mm:ss.sssZ".');
                      
                      	return 0;
                      }
                      
                      return Math.trunc((Date.now() - unixtime) / 1000);
