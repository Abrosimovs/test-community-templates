      items:
        - uuid: 7a96c2cb39ba4f05b0f3c8d81ee8a2f4
          name: 'Providers: Get data'
          type: SCRIPT
          key: openrouter.provider.data.get
          delay: '{$OPENROUTER.API.INTERVAL:"provider"}'
          history: '0'
          value_type: TEXT
          params: |
            const CTlsConfig = function (raw_value) {
            	raw_value = String(raw_value).trim().toLowerCase();
            
            	if (['none', 'peer', 'full'].indexOf(raw_value) === -1) {
            		raw_value = 'full';
            	}
            
            	this.options = {
            		SSLVerifyPeer: (raw_value === 'peer' || raw_value === 'full'),
            		SSLVerifyHost: (raw_value === 'full')
            	};
            
            	this.enabled = (raw_value !== 'none');
            
            	this.checkURL = function (url) {
            		if (this.enabled && !/^https:\/\//i.test(url)) {
            			throw 'TLS certificate verification is enabled by {$' + 'HTTP.TLS.VERIFY}, but the URL uses plain HTTP: ' + url +
            			'. Use an "https://" URL, or set {$' + 'HTTP.TLS.VERIFY} to `none` to disable verification.';
            		}
            
            		return url;
            	};
            }
            
            
            var Openrouter = {
            	params: {},
            
            	setParams: function (params) {
            		['api_url', 'api_token'].forEach(function (field) {
            			if (typeof params !== 'object' || typeof params[field] === 'undefined' || params[field] === '') {
            				throw 'Required param is not set: ' + field + '.';
            			}
            		});
            
            		Openrouter.params = params;
            
            		if (typeof Openrouter.params.api_url === 'string' && !Openrouter.params.api_url.endsWith('/')) {
            			Openrouter.params.api_url += '/';
            		}
            
            		Openrouter.tls = new CTlsConfig(params.tls_verify);
            		Openrouter.tls.checkURL(Openrouter.params.api_url);
            	},
            
            	getField: function (data, path, separator, default_value) {
            		if (typeof separator === 'undefined') {
            			separator = '.';
            		}
            
            		var steps = path.split(separator);
            
            		for (var i = 0; i < steps.length; i++) {
            			var step = steps[i];
            
            			if (typeof data !== 'object' || data === null || typeof data[step] === 'undefined') {
            				if (typeof default_value === 'undefined') {
            					throw 'Required field was not found: "' + path + '". Data: ' + JSON.stringify(data);
            				}
            
            				return default_value;
            			}
            
            			data = data[step];
            		}
            
            		return data;
            	},
            
            	bucketTimePeriod: function (bucket) {
            		var now = new Date(),
            			time_range = {"end":"", "start":""};
            
            		switch (bucket) {
            			case '1m':
            				now.setSeconds(0, 0);
            				time_range.end = now.toISOString();
            				now.setMinutes(now.getMinutes() - 1);
            				time_range.start = now.toISOString();
            				break;
            			case '1h':
            				now.setMinutes(0, 0, 0);
            				time_range.end = now.toISOString();
            				now.setHours(now.getHours() - 1);
            				time_range.start = now.toISOString();
            				break;
            			default:
            				throw 'Wrong granularity was set. Only `1h` or `1m` are allowed';
            		}
            
            		return time_range;
            	},
            
            	apiRequestGet: function (endpoint) {
            		var response = null,
            			request = new HttpRequest(Openrouter.tls.options),
            			uri = Openrouter.params.api_url + endpoint;
            
            		if (typeof Openrouter.params.http_proxy !== 'undefined' && Openrouter.params.http_proxy !== '') {
            			request.setProxy(Openrouter.params.http_proxy);
            		}
            
            		request.addHeader('Authorization: Bearer ' + Openrouter.params.api_token);
            		request.addHeader('Content-Type: ' + 'application/json');
            		response = request.get(uri);
            
            		if (request.getStatus() !== 200) {
            			var data;
            
            			try {
            				data = JSON.parse(response);
            			} catch (error) {
            				throw 'Failed to receive data: invalid response status code. Check debug log for more information.';
            			}
            			throw 'HTTP request error ' + Openrouter.getField(data, 'error.code') + ': ' + Openrouter.getField(data, 'error.message');
            		}
            
            		response = Openrouter.getField(JSON.parse(response), 'data', '.', []);
            
            		return response;
            	},
            
            	apiRequestQuery: function (dimension, granularity, filter_value, filter_bool) {
            		var response = null,
            			request = new HttpRequest(Openrouter.tls.options),
            			uri = Openrouter.params.api_url + 'analytics/query',
            			body = {},
            			granularity_word = '',
            			metrics = ["request_count","total_usage","tokens_total","tokens_prompt","tokens_completion",
            				"reasoning_tokens","cache_hit_rate","guardrail_invoked_rate","p50_latency","p99_latency",
            				"blended_cost_per_million_tokens"];
            
            		if (typeof Openrouter.params.http_proxy !== 'undefined' && Openrouter.params.http_proxy !== '') {
            			request.setProxy(Openrouter.params.http_proxy);
            		}
            
            		switch (granularity) {
            			case '1m':
            				granularity_word = 'minute';
            				break;
            			case '1h':
            				granularity_word = 'hour';
            				break;
            			default:
            				throw 'Wrong granularity was set. Only `1h` or `1m` are allowed';
            		}
            
            		body = {
            			"dimensions": [dimension],
            			"granularity": granularity_word,
            			"metrics": metrics,
            			"time_range": Openrouter.bucketTimePeriod(granularity)
            		};
            
            		if (filter_bool) {
            			body.filters = [{"field": dimension, "operator": "eq", "value": filter_value}];
            		}
            
            		request.addHeader('Authorization: Bearer ' + Openrouter.params.api_token);
            		request.addHeader('Content-Type: ' + 'application/json');
            		response = request.post(uri, JSON.stringify(body));
            
            		if (request.getStatus() !== 200) {
            			var data;
            
            			try {
            				data = JSON.parse(response);
            			} catch (error) {
            				throw 'Failed to receive data: invalid response status code. Check debug log for more information.';
            			}
            			throw 'HTTP request error ' + Openrouter.getField(data, 'error.code') + ': ' + Openrouter.getField(data, 'error.message');
            		}
            
            		response = Openrouter.getField(JSON.parse(response), 'data', '.', []);
            
            		if (!Array.isArray(response.data)) {
            			throw 'Error parsing query response - not an array.';
            		} else if (filter_bool) {
            			response = response.data[0];
            		}
            
            		return response;
            	}
            };
            
            
            
            var result = [],
