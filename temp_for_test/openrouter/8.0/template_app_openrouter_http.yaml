            - uuid: 7c4d917fcc444e8fa8abc0f5801d44d9
              name: 'Workspace [{#WORKSPACE.NAME}]: Since last update'
              type: DEPENDENT
              key: 'openrouter.workspace.update[{#WORKSPACE.ID}]'
              units: uptime
              description: 'Time passed since last changes in `{#WORKSPACE.NAME}` workspace.'
              preprocessing:
                - type: CHECK_JSON_ERROR
                  parameters:
                    - $.error
                - type: JSONPATH
                  parameters:
                    - $.overview.updated_at
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var safe_iso_string = value.replace(/(\.\d{3})\d+/, '$1'),
                      	unixtime = new Date(safe_iso_string).getTime();
                      
                      if (isNaN(unixtime)) {
                      	Zabbix.log(4, '[ OpenRouter API ] ERROR: Failed to parse value "' + value + '". Wrong date format. Expected ISO 8601 format: "YYYY-MM-DDTHH:mm:ss.sssZ".');
                      
                      	return 0;
                      }
                      
                      return Math.trunc((Date.now() - unixtime) / 1000);
              master_item:
