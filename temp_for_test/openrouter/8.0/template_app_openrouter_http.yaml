            try {
            	Openrouter.setParams(JSON.parse(value));
            	result = Openrouter.apiRequestGet('workspaces');
            } catch (error) {
            	error += (String(error).endsWith('.')) ? '' : '.';
            	Zabbix.log(3, '[ OpenRouter ] ERROR: ' + error);
            
            	return JSON.stringify({error: error});
            }
            
            return JSON.stringify(result);
