      description: |
        Monitoring OpenRouter data from https://openrouter.ai.
        
        Setup:
        1. Create an API token (management key) on https://openrouter.ai/settings/management-keys.
        2. Enter the API token into the {$OPENROUTER.API.TOKEN} macro.
        
        You can discuss this template or leave feedback on our forum https://www.zabbix.com/forum/zabbix-suggestions-and-feedback.
        
        Generated by official Zabbix template tool "Templator"
      wizard_ready: 'YES'
      readme: |
        ## Overview
        
        This template is designed for the effortless deployment of [OpenRouter](https://openrouter.ai) monitoring by Zabbix via HTTP and doesn't require any external scripts.
        
        Please consult the OpenRouter [API documentation](https://openrouter.ai/docs/api_reference/overview) for more details.
        
        ## Setup
        
        1. Create an API token (management key) on the [OpenRouter](https://openrouter.ai/settings/management-keys) page.
        2. Enter the API token into the `API token` field.
        
        tested_on: OpenRouter
